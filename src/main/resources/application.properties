spring.application.name=ProjectGym

# Configuración de la base de datos
spring.datasource.url=jdbc:mysql://localhost:3306/projectgym?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# CONFIGURACIÓN JPA / HIBERNATE

# create: crear tablas la primera vez, luego cambiar a update
spring.jpa.hibernate.ddl-auto=update

# mostrar SQL en consola
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# para evitar errores con MySQL
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# Para asegurar compatibilidad con MySQL
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ===============================
# Swagger (Springdoc OpenAPI)
# ===============================
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# ? OPCIONAL: Para evitar problemas de conexión
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.maximum-pool-size=5